---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (yamllint + ansible-lint production profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ansible-core ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint

  syntax:
    name: Playbook syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ansible-core
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax-check every playbook
        run: |
          for playbook in playbooks/*.yml; do
            echo "::group::${playbook}"
            ansible-playbook --syntax-check "${playbook}"
            echo "::endgroup::"
          done

  health-check-smoke:
    name: Health check smoke test (runs the role)
    runs-on: ubuntu-latest
    needs: [lint, syntax]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ansible-core
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Run the read-only health check against the runner
        run: |
          cat > /tmp/inventory.yml <<'EOF'
          all:
            children:
              rhel_servers:
                hosts:
                  localhost:
                    ansible_connection: local
          EOF
          ansible-playbook -i /tmp/inventory.yml playbooks/health_check.yml \
            -e rhel_health_check_report_dir="${GITHUB_WORKSPACE}/reports" \
            -e '{"rhel_health_check_filesystem_types": ["ext4", "xfs", "btrfs"]}'
      - name: Verify the reports were produced
        run: |
          test -s reports/health-report.md
          status="$(jq -r '.[0].status' reports/health-report.json)"
          echo "Host status: ${status}"
          [[ "${status}" =~ ^(OK|WARNING|CRITICAL)$ ]]
          cat reports/health-report.md >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        with:
          name: health-report
          path: reports/
