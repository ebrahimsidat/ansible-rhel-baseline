---
# sshd uses the first value it reads for most keywords, so the managed block is placed at the very top
# of sshd_config. That keeps it authoritative on RHEL 9, where drop-ins are included near the top.
- name: Apply SSH daemon hardening
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    insertbefore: BOF
    marker: "# {mark} ANSIBLE MANAGED: rhel_hardening"
    block: "{{ lookup('ansible.builtin.template', 'sshd_hardening.conf.j2') }}"
    validate: /usr/sbin/sshd -t -f %s
    backup: true
    mode: "0600"
  notify: Restart sshd
