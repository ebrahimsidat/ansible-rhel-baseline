---
- name: Apply kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ rhel_hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
